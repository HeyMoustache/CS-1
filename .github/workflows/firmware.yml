# SPDX-License-Identifier: GPL-3.0-only
# Build the FM-1 package (build/cs1.fwsc) on GitHub and run the host tests, on every push and by hand
# (Actions > firmware > Run workflow). The package is the run's artifact "cs1-fwsc": download it from the run's page
# and install it with the browser installer's "...or another .fwsc". The JieLi toolchain comes from
# pkgman.jieliapp.com (tools/get_toolchain.sh) and the AC79 SDK from gitee.com, as Dinghy's release workflow does.
name: firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it go into the package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build the package
        run: sh build.sh

      - name: Host tests (the app, the editor link, the TRS SysEx, the package over the updater)
        run: sh tests/run_host.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cs1-fwsc
          path: build/cs1.fwsc
          if-no-files-found: error
